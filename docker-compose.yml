version: "3.8"

services:
  n8n:
    image: n8nio/n8n
    container_name: agenda-obras-n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=obras2024
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_WEBHOOK_URL=http://192.168.0.244:5678
      - NODE_ENV=production
      - WEBHOOK_TUNNEL_URL=http://192.168.0.244:5678
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - agenda-network

  postgres:
    image: postgres:15
    container_name: agenda-obras-db
    restart: always
    environment:
      - POSTGRES_USER=agenda_user
      - POSTGRES_PASSWORD=obras2024
      - POSTGRES_DB=agenda_obras
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agenda-network

  redis:
    image: redis:7
    container_name: agenda-obras-redis
    restart: always
    networks:
      - agenda-network

volumes:
  n8n_data:
  postgres_data:

networks:
  agenda-network:
    driver: bridge